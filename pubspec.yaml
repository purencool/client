name: app
description: "Allows users to recieve data from services and sync them between devices."
publish_to: 'none' 
version: 1.0.0+1


environment:
  sdk: ^3.10.4


dependencies:
  flutter:
    sdk: flutter
  archive: any  
  animated_tree_view: any  
  cupertino_icons: ^1.0.8
  encrypt: any
  file_picker : any
  flutter_bloc : any
  flutter_dotenv: any
  flutter_secure_storage: any
  gpt_markdown:
   git:
    url: https://github.com/purencool/gpt_markdown.git
  intl: any
  http: any
  mailer: any
  markdown: any
  path: any
  path_provider: any
  pdf: any
  printing: ^5.11.0
  provider: any
  shared_preferences: any
  speech_to_text: any
  window_manager: any
  webview_flutter: any
  md_editor: 
   git:
    url: https://github.com/purencool/flutter_md_editor.git
  # webview_cef: any
  # git:
  #  url: https://github.com/purencool/webview_cef.git  
